<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist do Casamento 💍</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      /* Nova paleta: Azul Serenity, Azul Médio, Azul Marinho e Palha */
      --cream: #fbfaf8; 
      --straw: #e4d5b7;
      --serenity: #b3c6df;
      --blue-medium: #5b7b9c;
      --navy: #18283e;
      
      --deep: var(--navy);
      --rose: var(--blue-medium);
      --blush: var(--serenity);
      --gold: var(--straw);
      --sage: var(--blue-medium);
      --done: var(--blue-medium);
      --light: #eef2f6;
      --border: #d0dbe8;
      --shadow: rgba(24, 40, 62, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--cream);
      color: var(--deep);
      min-height: 100vh;
      padding: 0 0 80px;
    }

    header {
      background: var(--deep);
      padding: 48px 32px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 60% 0%, rgba(201, 169, 110, 0.18) 0%, transparent 70%), radial-gradient(ellipse at 20% 100%, rgba(232, 196, 184, 0.12) 0%, transparent 60%);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 300;
      color: var(--cream);
      letter-spacing: 0.04em;
      position: relative;
    }

    header h1 em {
      color: var(--gold);
      font-style: italic;
    }

    header p {
      color: var(--blush);
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 8px;
      position: relative;
    }

    .sync-status {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: 99px;
      font-weight: 500;
      transition: all 0.3s;
    }

    .sync-status.online {
      background: rgba(107, 155, 122, 0.25);
      color: #a8d8b8;
    }

    .sync-status.syncing {
      background: rgba(201, 169, 110, 0.25);
      color: var(--gold);
    }

    .sync-status.offline {
      background: rgba(193, 123, 110, 0.25);
      color: var(--blush);
    }

    .progress-bar-wrap {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 99px;
      height: 6px;
      max-width: 360px;
      margin: 20px auto 0;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--blush));
      border-radius: 99px;
      transition: width 0.5s cubic-bezier(.4, 0, .2, 1);
    }

    .progress-label {
      color: var(--gold);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      margin-top: 10px;
      position: relative;
    }

    .search-wrap {
      max-width: 780px;
      margin: 28px auto 0;
      padding: 0 20px;
    }

    .search-wrap input {
      width: 100%;
      padding: 12px 18px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.92rem;
      color: var(--deep);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-wrap input:focus {
      border-color: var(--gold);
    }

    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      max-width: 780px;
      margin: 14px auto 0;
      padding: 0 20px;
    }

    .filter-btn {
      padding: 6px 16px;
      border-radius: 99px;
      border: 1.5px solid var(--border);
      background: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--deep);
      cursor: pointer;
      transition: all 0.18s;
      letter-spacing: 0.04em;
    }

    .filter-btn:hover {
      border-color: var(--gold);
      color: var(--rose);
    }

    .filter-btn.active {
      background: var(--deep);
      color: var(--cream);
      border-color: var(--deep);
    }

    .sections {
      max-width: 780px;
      margin: 32px auto 0;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .section {
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 16px var(--shadow);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .section:hover {
      box-shadow: 0 4px 28px rgba(61, 43, 43, 0.13);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px 16px;
      cursor: pointer;
      user-select: none;
      gap: 12px;
      border-bottom: 1.5px solid var(--light);
    }

    .section-header:hover {
      background: var(--light);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .section-icon {
      font-size: 1.3rem;
    }

    .section-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.22rem;
      font-weight: 600;
      color: var(--deep);
    }

    .section-count {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--rose);
      background: var(--light);
      padding: 3px 10px;
      border-radius: 99px;
      white-space: nowrap;
    }

    .section-count.complete {
      color: var(--done);
      background: #eaf4ec;
    }

    .chevron {
      color: var(--border);
      font-size: 1rem;
      transition: transform 0.25s;
      flex-shrink: 0;
    }

    .section.open .chevron {
      transform: rotate(180deg);
    }

    .items-list {
      display: none;
      padding: 6px 0 10px;
      flex-direction: column;
    }

    .section.open .items-list {
      display: flex;
    }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 22px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .item:hover {
      background: var(--cream);
    }

    .item.done {
      opacity: 0.6;
    }

    .item.done .item-label {
      text-decoration: line-through;
      color: var(--sage);
    }

    .item.hidden {
      display: none;
    }

    .item.saving {
      opacity: 0.5;
      pointer-events: none;
    }

    .item-check {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      border: 2px solid var(--border);
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s;
      background: white;
    }

    .item.done .item-check {
      background: var(--done);
      border-color: var(--done);
    }

    .item.done .item-check::after {
      content: '✓';
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    .item-text {
      flex: 1;
    }

    .item-label {
      font-size: 0.91rem;
      font-weight: 400;
      color: var(--deep);
      line-height: 1.4;
    }

    .item-tip {
      font-size: 0.78rem;
      color: var(--sage);
      margin-top: 3px;
      font-style: italic;
      font-family: 'Playfair Display', serif;
      line-height: 1.4;
    }

    .item-tag {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--rose);
      background: #fdf0ec;
      border-radius: 99px;
      padding: 2px 8px;
      white-space: nowrap;
      align-self: center;
      flex-shrink: 0;
    }

    .item-tag.urgente {
      background: #fdecea;
      color: #c0392b;
    }

    .item-tag.novo {
      background: #eaf4ec;
      color: var(--done);
    }

    .section-progress {
      height: 3px;
      background: var(--light);
    }

    .section-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--sage));
      transition: width 0.4s ease;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--cream);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 999;
      transition: opacity 0.4s;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-ring {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--rose);
      font-style: italic;
    }

    .empty-search {
      text-align: center;
      padding: 48px 24px;
      color: var(--sage);
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-style: italic;
      display: none;
    }

    @media (max-width: 520px) {
      header {
        padding: 36px 20px 28px;
      }

      .sections,
      .search-wrap,
      .filter-row {
        padding: 0 12px;
      }

      .item {
        padding: 10px 14px;
      }

      .section-header {
        padding: 16px 14px;
      }
    }

  
    

    /* Delete and Edit buttons on items */
    

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(24, 40, 62, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      padding: 20px;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: var(--cream);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transform: translateY(20px);
      transition: transform 0.3s;
    }
    .modal-overlay.open .modal-content {
      transform: translateY(0);
    }
    .modal-header {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--navy);
      margin-bottom: 20px;
      font-weight: 600;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--blue-medium);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      color: var(--navy);
      background: white;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-cancel {
      background: transparent;
      color: var(--blue-medium);
    }
    .btn-save {
      background: var(--navy);
      color: var(--cream);
    }
    .btn-save:hover { background: var(--blue-medium); }

  
    .main-tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .main-tab {
      flex: 1;
      text-align: center;
      padding: 16px 0;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--blue-medium);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .main-tab.active {
      color: var(--navy);
      border-bottom-color: var(--navy);
    }
    
    .dashboard {
      padding: 24px;
      max-width: 800px;
      margin: 0 auto;
    }
    .dash-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px var(--shadow);
    }
    .dash-card h3 {
      font-family: 'Playfair Display', serif;
      color: var(--navy);
      margin-bottom: 16px;
      font-size: 1.3rem;
    }
    .dash-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }
    .dash-bar-bg {
      height: 8px;
      background: var(--light);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 6px;
    }
    .dash-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--sage));
      border-radius: 4px;
      transition: width 0.5s ease;
    }

  
    /* FAB (Floating Action Button) */
    .fab-add {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      background: var(--navy);
      color: var(--cream);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 4px 12px rgba(24, 40, 62, 0.3);
      cursor: pointer;
      z-index: 100;
      transition: transform 0.2s;
    }
    .fab-add:hover { transform: scale(1.08); }

    /* Delete and Edit buttons on items */
    .item-action {
      opacity: 0;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      transition: opacity 0.2s;
      margin-left: 8px;
    }
    .item-delete { color: #c17b6e; }
    .item:hover .item-action { opacity: 1; }
    @media (max-width: 520px) { .item-action { opacity: 1; } }

    /* Modal Styles */

    .form-group { margin-bottom: 16px; }

    .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 0.95rem; color: var(--navy); background: white; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
    .btn { padding: 10px 18px; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-cancel { background: transparent; color: var(--blue-medium); }
    .btn-cancel:hover { background: #e0e6ed; }
    .btn-save { background: var(--navy); color: var(--cream); }
    .btn-save:hover { background: var(--blue-medium); }

  
    .item-assignee {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--navy);
      background: var(--serenity);
      border-radius: 4px;
      padding: 2px 6px;
      white-space: nowrap;
      align-self: center;
      flex-shrink: 0;
      margin-left: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .item-assignee.Fhelipe { background: #d0e4f2; color: #1e4b6d; }

    .item-edit { color: var(--blue-medium); }

  
    .item-due {
      font-size: 0.65rem;
      font-weight: 500;
      color: #8c765c;
      background: #fcf8f2;
      border: 1px solid #ebdccb;
      border-radius: 4px;
      padding: 2px 6px;
      white-space: nowrap;
      align-self: center;
      flex-shrink: 0;
      margin-left: 8px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

  </style>
</head>

    function setSyncStatus(status) {
      const el = document.getElementById('syncStatus');
      if (!el) return;
      el.className = 'sync-status ' + status;
      if (status === 'online') {
        el.innerHTML = '● sincronizado';
      } else if (status === 'syncing') {
        el.innerHTML = '⏳ sincronizando...';
      } else if (status === 'offline') {
        el.innerHTML = '⚠️ erro de conexão';
      }
    }

    async function refreshData() {
      await loadFromDB();
      updateAssigneeFilters();
      renderAll();
      renderGeral();
    }

    async function loadFromDB() {
      setSyncStatus('syncing');
      try {
        const { data, error } = await db.from('checklist').select('*');
        if (error) {
          console.error(error);
          setSyncStatus('offline');
          return;
        }
        
        // Re-initialize DATA from the template INITIAL_DATA
        DATA = JSON.parse(JSON.stringify(INITIAL_DATA));
        state = {};
        
        data.forEach(row => {
          state[row.item_id] = !!row.done;

          // If the item is marked as deleted in the database, remove it from DATA
          if (row.deleted) {
            DATA.forEach(section => {
              section.items = section.items.filter(item => item.id !== row.item_id);
            });
            return;
          }

          // Search for the item in DATA
          let foundItem = null;
          let foundSection = null;
          for (const section of DATA) {
            const item = section.items.find(it => it.id === row.item_id);
            if (item) {
              foundItem = item;
              foundSection = section;
              break;
            }
          }

          if (foundItem) {
            // Update properties from the database if they exist
            if (row.label) foundItem.label = row.label;
            if (row.assignee !== undefined && row.assignee !== null) foundItem.assignee = row.assignee;
            if (row.due_period !== undefined && row.due_period !== null) foundItem.due_period = row.due_period;
            // Move item to correct section if it was edited
            if (row.section_id && foundSection.id !== row.section_id) {
              foundSection.items = foundSection.items.filter(it => it.id !== row.item_id);
              const targetSection = DATA.find(s => s.id === row.section_id);
              if (targetSection) {
                targetSection.items.push(foundItem);
              } else {
                foundSection.items.push(foundItem);
              }
            }
          } else {
            // It's a custom item added on another device (or this device in a previous session)
            if (row.label && row.section_id) {
              const targetSection = DATA.find(s => s.id === row.section_id) || DATA[0];
              if (targetSection) {
                targetSection.items.push({
                  id: row.item_id,
                  label: row.label,
                  assignee: row.assignee || null,
                  due_period: row.due_period || null,
                  tag: 'novo'
                });
              }
            }
          }
        });

        // Seed initial done items if db is empty (meaning no items have been checked/configured)
        if (data.length === 0) {
          const allItems = DATA.flatMap(s => s.items);
          const seedItems = allItems.filter(it => it.done);
          if (seedItems.length > 0) {
            await db.from('checklist').upsert(seedItems.map(it => {
              const sec = DATA.find(s => s.items.includes(it));
              return {
                item_id: it.id,
                done: true,
                label: it.label,
                section_id: sec ? sec.id : 'geral',
                assignee: it.assignee || null,
                due_period: it.due_period || null,
                deleted: false
              };
            }));
            seedItems.forEach(it => { state[it.id] = true; });
          }
        }
        
        setSyncStatus('online');
      } catch (err) {
        console.error(err);
        setSyncStatus('offline');
      }
    }

    async function toggleItem(id) {
      const el = document.getElementById('item-' + id);
      if(el) el.classList.add('saving');

      const newVal = !state[id];
      state[id] = newVal;

      setSyncStatus('syncing');
      try {
        const { error } = await db.from('checklist').upsert({ item_id: id, done: newVal }, { onConflict: 'item_id' });
        if (error) throw error;
        setSyncStatus('online');
      } catch (err) {
        console.error(err);
        state[id] = !newVal; // revert
        setSyncStatus('offline');
        alert('Falha ao sincronizar o item. Verifique sua conexão.');
      } finally {
        await refreshData();
      }
    }

    function subscribeRealtime() {
      channel = db.channel('checklist-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'checklist' }, async payload => {
           await refreshData();
        })
        .subscribe();
    }

    function filterItems() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      let anyVisible = false;
      DATA.forEach(section => {
        const sEl = document.getElementById('sec-' + section.id);
        if (!sEl) return;
        let sv = false;
        section.items.forEach(item => {
          const el = document.getElementById('item-' + item.id);
          if (!el) return;
          const isDone = !!state[item.id];
          const ms = !q || item.label.toLowerCase().includes(q) || (item.tip && item.tip.toLowerCase().includes(q));
          const mf = currentFilter === 'all' || (currentFilter === 'done' && isDone) || (currentFilter === 'pending' && !isDone);
          const ma = currentAssigneeFilter === 'all' || (item.assignee && item.assignee.split(',').map(a => a.trim()).includes(currentAssigneeFilter));
          const vis = ms && mf && ma;
          el.classList.toggle('hidden', !vis);
          if (vis) { sv = true; anyVisible = true; }
        });
        sEl.style.display = sv ? '' : 'none';
      });
      document.getElementById('emptyMsg').style.display = anyVisible ? 'none' : 'block';
    }

    function renderAll() {
      const container = document.getElementById('sections');
      let totalDone = 0, totalAll = 0;

      DATA.forEach(section => {
        const doneCnt = section.items.filter(it => !!state[it.id]).length;
        const total = section.items.length;
        totalDone += doneCnt; totalAll += total;
        const isComplete = doneCnt === total;

        let el = document.getElementById('sec-' + section.id);
        const wasOpen = el ? el.classList.contains('open') : true;

        if (!el) {
          el = document.createElement('div');
          el.id = 'sec-' + section.id;
          el.className = 'section' + (wasOpen ? ' open' : '');
          container.appendChild(el);
        }

        el.innerHTML = `
      <div class="section-progress"><div class="section-progress-fill" style="width:${total ? doneCnt / total * 100 : 0}%"></div></div>
      <div class="section-header" onclick="this.parentElement.classList.toggle('open')">
        <div class="section-title"><span class="section-icon">${section.icon}</span><span class="section-name">${section.name}</span></div>
        <span class="section-count ${isComplete ? 'complete' : ''}">${doneCnt}/${total}</span>
        <span class="chevron">▼</span>
      </div>
      <div class="items-list">
        ${section.items.map(item => {
          const isDone = !!state[item.id];
          return `<div class="item ${isDone ? 'done' : ''}" id="item-${item.id}" onclick="toggleItem('${item.id}')">
            <div class="item-check"></div>
            <div class="item-text">
              <div class="item-label">${item.label}</div>
              ${item.tip ? `<div class="item-tip">💡 ${item.tip}</div>` : ''}
            </div>
            ${item.tag ? `<span class="item-tag ${item.tag}">${item.tag === 'urgente' ? '🔴 urgente' : item.tag === 'novo' ? '🌿 sugestão' : item.tag}</span>` : ''}
            ${item.due_period ? `<span class="item-due">⏱️ ${item.due_period}</span>` : ''}
            ${item.assignee ? item.assignee.split(',').map(a => a.trim()).map(a => `<span class="item-assignee ${a}">${a}</span>`).join('') : ''}
            <div class="item-action item-edit" onclick="event.stopPropagation(); openModal('${item.id}')">✏️</div>
            <div class="item-action item-delete" onclick="event.stopPropagation(); removeTask(event, '${item.id}')">🗑️</div>
          </div>`;
        }).join('')}
      </div>`;

        if (wasOpen) el.classList.add('open');
      });

      const pct = totalAll ? Math.round(totalDone / totalAll * 100) : 0;
      document.getElementById('globalBar').style.width = pct + '%';
      document.getElementById('globalLabel').textContent = `${totalDone} de ${totalAll} tarefas concluídas (${pct}%)`;
      filterItems();
    }

    function openModal(editId = null) {
      editingItemId = editId;
      const modalHeader = document.querySelector('.modal-header');
      if(modalHeader) modalHeader.textContent = editId ? 'Editar Tarefa' : 'Nova Tarefa';

      let currentLabel = '';
      let currentAssignees = [];
      let currentSectionId = '';

      if (editId) {
        DATA.forEach(s => {
          const it = s.items.find(i => i.id === editId);
          if (it) {
            currentLabel = it.label;
            currentAssignees = it.assignee ? it.assignee.split(',').map(a => a.trim()) : [];
            currentSectionId = s.id;
          }
        });
      }

      const secSelect = document.getElementById('newTaskSection');
      if(secSelect) {
        secSelect.innerHTML = DATA.map(s => `<option value="${s.id}" ${s.id === currentSectionId ? 'selected' : ''}>${s.name}</option>`).join('');
        secSelect.disabled = !!editId; 
      }
      
      // Obter responsáveis únicos
      const assigneesSet = new Set(['Fhelipe', 'Maria', 'Helena']); // Padrão garantido
      DATA.forEach(sec => sec.items.forEach(it => { 
        if(it.assignee) {
          it.assignee.split(',').forEach(a => assigneesSet.add(a.trim()));
        }
      }));
      
      const checkboxContainer = document.getElementById('assigneeCheckboxes');
      if(checkboxContainer) {
        checkboxContainer.innerHTML = Array.from(assigneesSet).map(a => {
          const isChecked = currentAssignees.includes(a);
          return `
            <label style="display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; background: var(--light); padding: 4px 10px; border-radius: 6px;">
              <input type="checkbox" name="taskAssignees" value="${a}" ${isChecked ? 'checked' : ''} style="width: auto; margin: 0;">
              ${a}
            </label>
          `;
        }).join('');
      }
      
      let currentDue = '';
      if (editId) {
        DATA.forEach(s => {
          const it = s.items.find(i => i.id === editId);
          if (it) currentDue = it.due_period || '';
        });
      }
      const dueSelect = document.getElementById('newTaskDuePeriod');
      if(dueSelect) dueSelect.value = currentDue;

      const labelInput = document.getElementById('newTaskLabel');
      if(labelInput) labelInput.value = currentLabel;
      
      const newAssInput = document.getElementById('newAssigneeName');
      if(newAssInput) newAssInput.value = '';
      
      document.getElementById('taskModal').classList.add('open');
    }

    function addNewAssigneeCheckbox() {
      const input = document.getElementById('newAssigneeName');
      const name = input ? input.value.trim() : '';
      if(!name) return alert('Digite o nome do novo responsável!');

      // Verificar se já existe
      const existingCheckboxes = Array.from(document.querySelectorAll('input[name="taskAssignees"]'));
      const exists = existingCheckboxes.some(cb => cb.value.toLowerCase() === name.toLowerCase());
      if(exists) return alert('Este responsável já está na lista!');

      const checkboxContainer = document.getElementById('assigneeCheckboxes');
      if(checkboxContainer) {
        const newHtml = `
          <label style="display: flex; align-items: center; gap: 6px; font-size: 0.9rem; cursor: pointer; background: var(--light); padding: 4px 10px; border-radius: 6px;">
            <input type="checkbox" name="taskAssignees" value="${name}" checked style="width: auto; margin: 0;">

        `;
        checkboxContainer.insertAdjacentHTML('beforeend', newHtml);
      }
      if(input) input.value = '';
    }

    async function saveNewTask() {
      try {
        const label = document.getElementById('newTaskLabel').value.trim();
        const section_id = document.getElementById('newTaskSection').value;
        
        // Coleta responsáveis selecionados
        const checkedBoxes = Array.from(document.querySelectorAll('input[name="taskAssignees"]:checked'));
        const assignee = checkedBoxes.map(cb => cb.value).join(', ');
        
        const due_period = document.getElementById('newTaskDuePeriod').value;
        
        if(!label) return alert('Preencha a tarefa!');

        const item_id = editingItemId || ('custom_' + Date.now());
        const doneStatus = editingItemId ? !!state[item_id] : false;

        const { error } = await db.from('checklist').upsert({
          item_id, done: doneStatus, label, section_id, assignee: assignee || null, due_period: due_period || null, deleted: false
        });
        
        if(error) throw error;
        
        closeModal();
        await refreshData();
      } catch (err) {
        console.error(err);
        alert('Erro ao salvar tarefa: ' + err.message);
      }
    }

    async function removeTask(e, id) {
      e.stopPropagation();
      if(!confirm('Tem certeza que deseja remover esta tarefa?')) return;
      
      try {
        const { error } = await db.from('checklist').upsert({
          item_id: id, deleted: true
        });
        
        if(error) throw error;

        await refreshData();
      } catch (err) {
        console.error(err);
        alert('Erro ao remover: ' + err.message);
      }
    }

    function setAssigneeFilter(val, btn) {
      currentAssigneeFilter = val;
      document.querySelectorAll('#assigneeFilters .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterItems();
    }

    function updateAssigneeFilters() {
      const container = document.getElementById('assigneeFilters');
      if(!container) return;
      const assignees = new Set();
      DATA.forEach(sec => sec.items.forEach(it => { 
        if(it.assignee) {
          it.assignee.split(',').forEach(a => assignees.add(a.trim()));
        }
      }));
      
      let html = `<button class="filter-btn ${currentAssigneeFilter === 'all' ? 'active' : ''}" onclick="setAssigneeFilter('all',this)">Todos (Resp.)</button>`;
      assignees.forEach(a => {
        html += `<button class="filter-btn ${currentAssigneeFilter === a ? 'active' : ''}" onclick="setAssigneeFilter('${a}',this)">${a}</button>`;
      });
      container.innerHTML = html;
    }

    


    // --- VISÃO GERAL ---
    function switchTab(tabId) {
      document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
      event.currentTarget.classList.add('active');
      
      if(tabId === 'checklist') {
        document.getElementById('view-checklist').style.display = 'block';
        document.getElementById('view-geral').style.display = 'none';
      } else {
        document.getElementById('view-checklist').style.display = 'none';
        document.getElementById('view-geral').style.display = 'block';
        renderGeral();
      }
    }

    function renderGeral() {
      const container = document.getElementById('dashboardContent');
      let totalItems = 0;
      let totalDone = 0;
      
      const sectionsStats = [];

      const assignees = {};

      DATA.forEach(section => {
        let secTotal = section.items.length;
        let secDone = 0;
        
        section.items.forEach(it => {
          totalItems++;
          const isDone = !!state[it.id];
          if(isDone) {
            totalDone++;
            secDone++;
          }
          
          if(it.assignee) {
            it.assignee.split(',').forEach(rawA => {
              const a = rawA.trim();
              if(!assignees[a]) assignees[a] = { total: 0, done: 0 };
              assignees[a].total++;
              if(isDone) assignees[a].done++;
            });
          }
        });
        
        sectionsStats.push({ name: section.name, icon: section.icon, total: secTotal, done: secDone });
      });

      const pctGlobal = totalItems ? Math.round((totalDone / totalItems) * 100) : 0;

      // Calculando tempo restante
      const weddingDate = new Date('2026-07-25T09:00:00-03:00');
      const now = new Date();
      const diff = weddingDate - now;
      
      let countdownStr = "Chegou o grande dia!";
      if (diff > 0) {
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        countdownStr = `Faltam <strong>${days} dias</strong> e <strong>${hours} horas</strong>`;
      }

      let html = `
        <div class="dash-card" style="text-align: center; background: linear-gradient(135deg, var(--serenity), var(--light));">
          <h3 style="margin-bottom: 8px;">O Grande Dia 💍</h3>
          <div style="font-size: 1rem; color: var(--navy); opacity: 0.8;">25 de Julho de 2026, às 09:00</div>
          <div style="font-size: 1.5rem; color: var(--navy); font-weight: 500; margin-top: 12px;">${countdownStr}</div>
        </div>
        <div class="dash-card">
          <h3>Progresso Total</h3>
          <div style="font-size: 2.5rem; color: var(--navy); font-weight: 300; text-align: center; margin: 10px 0;">${pctGlobal}%</div>
          <div style="text-align: center; color: var(--blue-medium); font-size: 0.9rem;">${totalDone} de ${totalItems} tarefas concluídas</div>
          <div class="dash-bar-bg" style="margin-top: 16px; height: 12px;"><div class="dash-bar-fill" style="width: ${pctGlobal}%"></div></div>
        </div>
      `;

      if(Object.keys(assignees).length > 0) {
        html += `<div class="dash-card"><h3>Por Responsável</h3>`;
        for(let a in assignees) {
          const stats = assignees[a];
          const pct = stats.total ? Math.round((stats.done / stats.total) * 100) : 0;
          html += `
            <div class="dash-stat">
              <span><strong>${a}</strong> <span style="color:#888; font-size:0.8rem">(${stats.done}/${stats.total})</span></span>
              <span>${pct}%</span>
            </div>
            <div class="dash-bar-bg"><div class="dash-bar-fill" style="width: ${pct}%; background: var(--blue-medium)"></div></div>
            <br>
          `;
        }
        html += `</div>`;
      }

      html += `<div class="dash-card"><h3>Por Etapa</h3>`;
      sectionsStats.forEach(s => {
        const pct = s.total ? Math.round((s.done / s.total) * 100) : 0;
        html += `
          <div class="dash-stat">
            <span>${s.icon} ${s.name}</span>
            <span>${s.done}/${s.total} (${pct}%)</span>
          </div>
          <div class="dash-bar-bg"><div class="dash-bar-fill" style="width: ${pct}%; background: var(--serenity)"></div></div>
          <br>
        `;
      });
      html += `</div>`;

      container.innerHTML = html;
    }


// ─── INIT ────────────────────────────────────────────────────────────────────
    (async () => {
      await refreshData();
      subscribeRealtime();
      document.getElementById('loadingOverlay').classList.add('hidden');
    })();
  </script>

  </div>

  <div id="view-geral" style="display: block;">
    <div class="dashboard" id="dashboardContent">
      <!-- Injetado via JS -->
    </div>
  </div>


  <div class="fab-add" onclick="openModal()">+</div>

  <div class="modal-overlay" id="taskModal">
    <div class="modal-content">
      <div class="modal-header">Nova Tarefa</div>
      
      <div class="form-group">
        <label>O que precisa ser feito?</label>
        <input type="text" id="newTaskLabel" placeholder="Ex: Comprar lembrancinhas">
      </div>

      <div class="form-group">
        <label>Em qual etapa?</label>
        <select id="newTaskSection">
          <!-- Preenchido via JS -->
        </select>
      </div>

      <div class="form-group">
        <label>Responsáveis (Selecione um ou mais)</label>
        <div id="assigneeCheckboxes" style="display: flex; flex-wrap: wrap; gap: 10px; padding: 8px; border: 1.5px solid var(--border); border-radius: 8px; background: white; max-height: 120px; overflow-y: auto; margin-bottom: 8px;">
          <!-- Checkboxes injetados via JS -->
        </div>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="newAssigneeName" placeholder="Novo responsável..." style="flex: 1; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px;">
          <button type="button" class="btn btn-save" onclick="addNewAssigneeCheckbox()" style="padding: 0 16px; margin: 0; font-size: 1.1rem; height: 38px;">+</button>
        </div>
      </div>


      

      
      <div class="form-group">
        <label>Prazo sugerido (Até quanto tempo antes?)</label>
        <select id="newTaskDuePeriod">
          <option value="">Sem prazo definido</option>
          <option value="12 meses antes">12 meses antes</option>
          <option value="9 meses antes">9 meses antes</option>
          <option value="6 meses antes">6 meses antes</option>
          <option value="3 meses antes">3 meses antes</option>
          <option value="1 mês antes">1 mês antes</option>
          <option value="15 dias antes">15 dias antes</option>
          <option value="Na semana">Na semana do casamento</option>
          <option value="No dia">No dia do casamento</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-save" onclick="saveNewTask()">Adicionar</button>
      </div>
    </div>
  </div>

</body>

</html>
