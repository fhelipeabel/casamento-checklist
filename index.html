<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist do Casamento 💍</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Nova paleta: Azul Serenity, Azul Médio, Azul Marinho e Palha */
      --cream: #fbfaf8; 
      --straw: #e4d5b7;
      --serenity: #b3c6df;
      --blue-medium: #5b7b9c;
      --navy: #18283e;
      
      --deep: var(--navy);
      --rose: var(--blue-medium);
      --blush: var(--serenity);
      --gold: var(--straw);
      --sage: var(--blue-medium);
      --done: var(--blue-medium);
      --light: #eef2f6;
      --border: #d0dbe8;
      --shadow: rgba(24, 40, 62, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--cream);
      color: var(--deep);
      min-height: 100vh;
      padding: 0 0 80px;
    }

    header {
      background: var(--deep);
      padding: 48px 32px 36px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 60% 0%, rgba(201, 169, 110, 0.18) 0%, transparent 70%), radial-gradient(ellipse at 20% 100%, rgba(232, 196, 184, 0.12) 0%, transparent 60%);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 300;
      color: var(--cream);
      letter-spacing: 0.04em;
      position: relative;
    }

    header h1 em {
      color: var(--gold);
      font-style: italic;
    }

    header p {
      color: var(--blush);
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 8px;
      position: relative;
    }

    .sync-status {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: 99px;
      font-weight: 500;
      transition: all 0.3s;
    }

    .sync-status.online {
      background: rgba(107, 155, 122, 0.25);
      color: #a8d8b8;
    }

    .sync-status.syncing {
      background: rgba(201, 169, 110, 0.25);
      color: var(--gold);
    }

    .sync-status.offline {
      background: rgba(193, 123, 110, 0.25);
      color: var(--blush);
    }

    .progress-bar-wrap {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 99px;
      height: 6px;
      max-width: 360px;
      margin: 20px auto 0;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--blush));
      border-radius: 99px;
      transition: width 0.5s cubic-bezier(.4, 0, .2, 1);
    }

    .progress-label {
      color: var(--gold);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      margin-top: 10px;
      position: relative;
    }

    .search-wrap {
      max-width: 780px;
      margin: 28px auto 0;
      padding: 0 20px;
    }

    .search-wrap input {
      width: 100%;
      padding: 12px 18px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.92rem;
      color: var(--deep);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-wrap input:focus {
      border-color: var(--gold);
    }

    .filter-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      max-width: 780px;
      margin: 14px auto 0;
      padding: 0 20px;
    }

    .filter-btn {
      padding: 6px 16px;
      border-radius: 99px;
      border: 1.5px solid var(--border);
      background: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--deep);
      cursor: pointer;
      transition: all 0.18s;
      letter-spacing: 0.04em;
    }

    .filter-btn:hover {
      border-color: var(--gold);
      color: var(--rose);
    }

    .filter-btn.active {
      background: var(--deep);
      color: var(--cream);
      border-color: var(--deep);
    }

    .sections {
      max-width: 780px;
      margin: 32px auto 0;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .section {
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 16px var(--shadow);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    .section:hover {
      box-shadow: 0 4px 28px rgba(61, 43, 43, 0.13);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px 16px;
      cursor: pointer;
      user-select: none;
      gap: 12px;
      border-bottom: 1.5px solid var(--light);
    }

    .section-header:hover {
      background: var(--light);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .section-icon {
      font-size: 1.3rem;
    }

    .section-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.22rem;
      font-weight: 600;
      color: var(--deep);
    }

    .section-count {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--rose);
      background: var(--light);
      padding: 3px 10px;
      border-radius: 99px;
      white-space: nowrap;
    }

    .section-count.complete {
      color: var(--done);
      background: #eaf4ec;
    }

    .chevron {
      color: var(--border);
      font-size: 1rem;
      transition: transform 0.25s;
      flex-shrink: 0;
    }

    .section.open .chevron {
      transform: rotate(180deg);
    }

    .items-list {
      display: none;
      padding: 6px 0 10px;
      flex-direction: column;
    }

    .section.open .items-list {
      display: flex;
    }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 22px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .item:hover {
      background: var(--cream);
    }

    .item.done {
      opacity: 0.6;
    }

    .item.done .item-label {
      text-decoration: line-through;
      color: var(--sage);
    }

    .item.hidden {
      display: none;
    }

    .item.saving {
      opacity: 0.5;
      pointer-events: none;
    }

    .item-check {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      border: 2px solid var(--border);
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s;
      background: white;
    }

    .item.done .item-check {
      background: var(--done);
      border-color: var(--done);
    }

    .item.done .item-check::after {
      content: '✓';
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    .item-text {
      flex: 1;
    }

    .item-label {
      font-size: 0.91rem;
      font-weight: 400;
      color: var(--deep);
      line-height: 1.4;
    }

    .item-tip {
      font-size: 0.78rem;
      color: var(--sage);
      margin-top: 3px;
      font-style: italic;
      font-family: 'Playfair Display', serif;
      line-height: 1.4;
    }

    .item-tag {
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--rose);
      background: #fdf0ec;
      border-radius: 99px;
      padding: 2px 8px;
      white-space: nowrap;
      align-self: center;
      flex-shrink: 0;
    }

    .item-tag.urgente {
      background: #fdecea;
      color: #c0392b;
    }

    .item-tag.novo {
      background: #eaf4ec;
      color: var(--done);
    }

    .section-progress {
      height: 3px;
      background: var(--light);
    }

    .section-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--sage));
      transition: width 0.4s ease;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--cream);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 999;
      transition: opacity 0.4s;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-ring {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--rose);
      font-style: italic;
    }

    .empty-search {
      text-align: center;
      padding: 48px 24px;
      color: var(--sage);
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-style: italic;
      display: none;
    }

    @media (max-width: 520px) {
      header {
        padding: 36px 20px 28px;
      }

      .sections,
      .search-wrap,
      .filter-row {
        padding: 0 12px;
      }

      .item {
        padding: 10px 14px;
      }

      .section-header {
        padding: 16px 14px;
      }
    }
  
    .item-assignee {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--navy);
      background: var(--serenity);
      border-radius: 4px;
      padding: 2px 6px;
      white-space: nowrap;
      align-self: center;
      flex-shrink: 0;
      margin-left: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .item-assignee.Fhelipe { background: #d0e4f2; color: #1e4b6d; }
    .item-assignee.Maria { background: #f2e3d0; color: #6d4a1e; }
    .item-assignee.Helena { background: #e2d0f2; color: #4a1e6d; }

  
    

    /* Delete and Edit buttons on items */
    

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(24, 40, 62, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      padding: 20px;
    }
    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background: var(--cream);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transform: translateY(20px);
      transition: transform 0.3s;
    }
    .modal-overlay.open .modal-content {
      transform: translateY(0);
    }
    .modal-header {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--navy);
      margin-bottom: 20px;
      font-weight: 600;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--blue-medium);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      color: var(--navy);
      background: white;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }
    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-cancel {
      background: transparent;
      color: var(--blue-medium);
    }
    .btn-save {
      background: var(--navy);
      color: var(--cream);
    }
    .btn-save:hover { background: var(--blue-medium); }

  </style>
</head>

    // ─── STATE ───────────────────────────────────────────────────────────────────
    let state = {};          // { item_id: true/false }
    let currentFilter = 'all';
    let currentAssigneeFilter = 'all';
    let channel = null;

    // ─── SUPABASE HELPERS ────────────────────────────────────────────────────────
    async function loadFromDB() {
      const { data, error } = await db.from('checklist').select('*');
      if (error) { console.error(error); return; }
      state = {};
      data.forEach(row => { 
        state[row.item_id] = row.done; 
      });
      
      updateAssigneeFilters();

      // Seed initial done items se banco vazio
      const allItems = DATA.flatMap(s => s.items);
      const seedItems = allItems.filter(it => it.done && state[it.id] === undefined);
      if (seedItems.length > 0) {
        await db.from('checklist').upsert(seedItems.map(it => ({ item_id: it.id, done: true })));
        seedItems.forEach(it => { state[it.id] = true; });
      }
    }

    async function toggleItem(id) {
      const el = document.getElementById('item-' + id);
      if(el) el.classList.add('saving');

      const newVal = !state[id];
      state[id] = newVal;

      try {
        const { error } = await db.from('checklist').upsert({ item_id: id, done: newVal }, { onConflict: 'item_id' });
        if (error) throw error;
      } catch (err) {
        console.error(err);
        state[id] = !newVal; // revert
        alert('Falha ao sincronizar o item. Verifique sua conexão.');
      } finally {
        renderAll();
      }
    }

    function subscribeRealtime() {
      channel = db.channel('checklist-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'checklist' }, async payload => {
           await loadFromDB();
           renderAll();
        })
        .subscribe();
    }

    function filterItems() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      let anyVisible = false;
      DATA.forEach(section => {
        const sEl = document.getElementById('sec-' + section.id);
        if (!sEl) return;
        let sv = false;
        section.items.forEach(item => {
          const el = document.getElementById('item-' + item.id);
          if (!el) return;
          const isDone = !!state[item.id];
          const ms = !q || item.label.toLowerCase().includes(q) || (item.tip && item.tip.toLowerCase().includes(q));
          const mf = currentFilter === 'all' || (currentFilter === 'done' && isDone) || (currentFilter === 'pending' && !isDone);
          const ma = currentAssigneeFilter === 'all' || item.assignee === currentAssigneeFilter;
          const vis = ms && mf && ma;
          el.classList.toggle('hidden', !vis);
          if (vis) { sv = true; anyVisible = true; }
        });
        sEl.style.display = sv ? '' : 'none';
      });
      document.getElementById('emptyMsg').style.display = anyVisible ? 'none' : 'block';
    }

    function renderAll() {
      const container = document.getElementById('sections');
      let totalDone = 0, totalAll = 0;

      DATA.forEach(section => {
        const doneCnt = section.items.filter(it => !!state[it.id]).length;
        const total = section.items.length;
        totalDone += doneCnt; totalAll += total;
        const isComplete = doneCnt === total;

        let el = document.getElementById('sec-' + section.id);
        const wasOpen = el ? el.classList.contains('open') : true;

        if (!el) {
          el = document.createElement('div');
          el.id = 'sec-' + section.id;
          el.className = 'section' + (wasOpen ? ' open' : '');
          container.appendChild(el);
        }

        el.innerHTML = `
      <div class="section-progress"><div class="section-progress-fill" style="width:${total ? doneCnt / total * 100 : 0}%"></div></div>
      <div class="section-header" onclick="this.parentElement.classList.toggle('open')">
        <div class="section-title"><span class="section-icon">${section.icon}</span><span class="section-name">${section.name}</span></div>
        <span class="section-count ${isComplete ? 'complete' : ''}">${doneCnt}/${total}</span>
        <span class="chevron">▼</span>
      </div>
      <div class="items-list">
        ${section.items.map(item => {
          const isDone = !!state[item.id];
          return `<div class="item ${isDone ? 'done' : ''}" id="item-${item.id}" onclick="toggleItem('${item.id}')">
            <div class="item-check"></div>
            <div class="item-text">
              <div class="item-label">${item.label}</div>
              ${item.tip ? `<div class="item-tip">💡 ${item.tip}</div>` : ''}
            </div>
            ${item.tag ? `<span class="item-tag ${item.tag}">${item.tag === 'urgente' ? '🔴 urgente' : item.tag === 'novo' ? '🌿 sugestão' : item.tag}</span>` : ''}
            ${item.assignee ? `<span class="item-assignee" style="background: var(--light); color: var(--navy);">${item.assignee}</span>` : ''}
          </div>`;
        }).join('')}
      </div>`;

        if (wasOpen) el.classList.add('open');
      });

      const pct = totalAll ? Math.round(totalDone / totalAll * 100) : 0;
      document.getElementById('globalBar').style.width = pct + '%';
      document.getElementById('globalLabel').textContent = `${totalDone} de ${totalAll} tarefas concluídas (${pct}%)`;
      filterItems();
    }

// --- FUNÇÕES DINÂMICAS E FILTROS ---
    function updateAssigneeFilters() {
      const container = document.getElementById('assigneeFilters');
      if(!container) return;
      const assignees = new Set();
      DATA.forEach(sec => sec.items.forEach(it => { if(it.assignee) assignees.add(it.assignee); }));
      
      let html = `<button class="filter-btn ${currentAssigneeFilter === 'all' ? 'active' : ''}" onclick="setAssigneeFilter('all',this)">Todos (Resp.)</button>`;
      assignees.forEach(a => {
        html += `<button class="filter-btn ${currentAssigneeFilter === a ? 'active' : ''}" onclick="setAssigneeFilter('${a}',this)">${a}</button>`;
      });
      container.innerHTML = html;
    }

// ─── INIT ────────────────────────────────────────────────────────────────────
    (async () => {
      await loadFromDB();
      renderAll();
      subscribeRealtime();
      document.getElementById('loadingOverlay').classList.add('hidden');
    })();
  </script>
